name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 저장소 Settings > Pages에서 수동으로도 실행할 수 있게
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # next.config.ts가 이 값으로 GitHub Pages용 basePath(/rally)를 켠다
          NEXT_PUBLIC_GITHUB_PAGES: "1"
          # Settings > Secrets and variables > Actions에 등록해야 실제 값이 들어간다.
          # 비어 있어도 빌드는 되지만 Spotify/Kakao 로그인 버튼이 "키가 없다"고 안내한다.
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_SPOTIFY_CLIENT_ID }}
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
